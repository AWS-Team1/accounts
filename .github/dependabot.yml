version: 2

updates:
  - package-ecosystem: docker
    directories:
      - /src/accounts/contacts
      - /src/accounts/userservice

    target-branch: dev

    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul

    open-pull-requests-limit: 1

    groups:
      docker-base-images:
        patterns:
          - "*"

    ignore:
      # Python 3.14.x 범위만 자동 업데이트
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

      # uv 0.12.x 범위만 자동 업데이트
      - dependency-name: ghcr.io/astral-sh/uv
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
